name: Validate NovaBuild AI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check required application files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f config.js
          test -f supabase-auth.js
          test -f agents.js
          test -f supabase/functions/generate-website/index.ts
          test -f supabase/functions/ai-assistant/index.ts
          test -f supabase/functions/business-agent/index.ts
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check supabase-auth.js
          node --check agents.js
          node --check friendly-mode.js
          node --check help-bot.js
          node --check i18n.js
      - name: Check HTML document basics
        run: |
          grep -qi '<!doctype html>' index.html
          grep -q 'id="makeAIWebsite"' index.html
          grep -q 'id="siteBrief"' index.html
          grep -q 'src="friendly-mode.js"' index.html
          grep -q 'href="friendly-mode.css"' index.html
